<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090D16" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#cyber-grad)" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Outer Circuit Bits -->
  <circle cx="16" cy="16" r="3" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="48" cy="16" r="3" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="16" cy="48" r="3" fill="#3B82F6" />
  <circle cx="48" cy="48" r="3" fill="#00F0FF" />
  
  <!-- Circuit Pathways -->
  <path d="M16 16 H32 V24 M48 16 H36 V32 M16 48 H28 V36 M48 48 H32 V40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />
  
  <!-- Central 'B' and Bit Manipulation Mark -->
  <path d="M22 18 H35 C40 18 43 21 43 25 C43 28.5 40.5 31 37 32 C41.5 33 44 36 44 40 C44 45 40 47 34 47 H22 V18 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M28 24 H34 C36.5 24 38 25 38 27 C38 29 36.5 30 34 30 H28 V24 Z" fill="#00F0FF" opacity="0.8" />
  <path d="M28 35 H35 C37.5 35 39 36 39 38.5 C39 41 37.5 42 35 42 H28 V35 Z" fill="#8B5CF6" opacity="0.8" />
</svg>
