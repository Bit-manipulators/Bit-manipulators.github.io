<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#140f2b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Code Editor Window Frame -->
  <rect x="40" y="40" width="440" height="370" rx="12" fill="#070a12" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Window Header -->
  <rect x="40" y="40" width="440" height="38" rx="12" fill="#0d1322" />
  <circle cx="62" cy="59" r="5" fill="#ef4444" />
  <circle cx="78" cy="59" r="5" fill="#f59e0b" />
  <circle cx="94" cy="59" r="5" fill="#10b981" />
  <text x="120" y="63" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">analyzer.py — DevLens OCR Sandbox</text>

  <!-- Code Lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="11.5">
    <!-- Line Numbers -->
    <text x="56" y="105" fill="#475569">01</text>
    <text x="56" y="130" fill="#475569">02</text>
    <text x="56" y="155" fill="#475569">03</text>
    <text x="56" y="180" fill="#475569">04</text>
    <text x="56" y="205" fill="#ef4444">05</text>
    <text x="56" y="230" fill="#475569">06</text>
    <text x="56" y="255" fill="#475569">07</text>
    <text x="56" y="280" fill="#475569">08</text>

    <!-- Code Syntax -->
    <text x="85" y="105" fill="#c084fc">def</text>
    <text x="115" y="105" fill="#38bdf8">verify_packet_integrity</text>
    <text x="290" y="105" fill="#e2e8f0">(buffer, length):</text>

    <text x="105" y="130" fill="#64748b"># In-memory zero-trust sandbox scan</text>

    <text x="105" y="155" fill="#c084fc">for</text>
    <text x="135" y="155" fill="#e2e8f0">idx</text>
    <text x="165" y="155" fill="#c084fc">in</text>
    <text x="185" y="155" fill="#f59e0b">range</text>
    <text x="225" y="155" fill="#e2e8f0">(0, length):</text>

    <text x="125" y="180" fill="#38bdf8">chunk</text>
    <text x="170" y="180" fill="#e2e8f0">=</text>
    <text x="185" y="180" fill="#e2e8f0">buffer[idx]</text>

    <!-- Bug Highlight -->
    <rect x="85" y="193" width="370" height="20" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="125" y="207" fill="#f87171">if chunk == NULL: return -1</text>
    <text x="325" y="207" fill="#ef4444" font-weight="bold">← [OFF-BY-ONE BUG]</text>

    <text x="105" y="230" fill="#c084fc">return</text>
    <text x="155" y="230" fill="#34d399">0x7F # PASS</text>
  </g>

  <!-- Diagnostics Overlay Panel -->
  <rect x="56" y="300" width="408" height="92" rx="8" fill="#131b2e" stroke="#a855f7" stroke-width="1.2" />
  <text x="72" y="322" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">⚡ DevLens Heuristic Diagnostic Engine</text>
  <text x="72" y="342" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Rule ID: BOUNDS_01 • Severity: HIGH</text>
  <text x="72" y="362" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">Potential off-by-one memory dereference in buffer loop.</text>
  <text x="72" y="380" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">Recommended Diff: buffer.len() clamped safely via bounds check.</text>

  <!-- Sandbox Isolation Architecture Card (Right Side) -->
  <rect x="510" y="40" width="250" height="370" rx="12" fill="#0d1424" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="530" y="70" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">🛡️ ZERO-TRUST SANDBOX</text>

  <!-- Pipeline Steps -->
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <!-- Step 1 -->
    <rect x="530" y="90" width="210" height="48" rx="8" fill="#1a1c30" stroke="#6366f1" stroke-width="1" />
    <text x="542" y="110" fill="#e2e8f0" font-weight="bold">1. Camera OCR Scan</text>
    <text x="542" y="126" fill="#94a3b8" font-size="9.5">In-Memory (0 bytes on disk)</text>

    <!-- Arrow -->
    <path d="M635 138 L635 152 M630 148 L635 153 L640 148" stroke="#a855f7" stroke-width="1.5" />

    <!-- Step 2 -->
    <rect x="530" y="155" width="210" height="48" rx="8" fill="#1a1c30" stroke="#a855f7" stroke-width="1" />
    <text x="542" y="175" fill="#c084fc" font-weight="bold">2. Static AST Parser</text>
    <text x="542" y="191" fill="#94a3b8" font-size="9.5">Python, JS, C++, Java</text>

    <!-- Arrow -->
    <path d="M635 203 L635 217 M630 213 L635 218 L640 213" stroke="#a855f7" stroke-width="1.5" />

    <!-- Step 3 -->
    <rect x="530" y="220" width="210" height="48" rx="8" fill="#1a1c30" stroke="#10b981" stroke-width="1" />
    <text x="542" y="240" fill="#34d399" font-weight="bold">3. Ephemeral Docker</text>
    <text x="542" y="256" fill="#94a3b8" font-size="9.5">--net=none • 256MB Cap</text>

    <!-- Arrow -->
    <path d="M635 268 L635 282 M630 278 L635 283 L640 278" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Step 4 -->
    <rect x="530" y="285" width="210" height="48" rx="8" fill="#1a1c30" stroke="#00f0ff" stroke-width="1" />
    <text x="542" y="305" fill="#38bdf8" font-weight="bold">4. AI Diff Repair</text>
    <text x="542" y="321" fill="#94a3b8" font-size="9.5">Local LLM + Unit Test Suite</text>
  </g>

  <!-- Status Footer -->
  <rect x="530" y="350" width="210" height="44" rx="6" fill="#09101d" border="1" stroke="#334155" />
  <circle cx="548" cy="372" r="4" fill="#10b981" />
  <text x="560" y="376" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Sandbox Egress: 0 KB (ISOLATED)</text>
</svg>
